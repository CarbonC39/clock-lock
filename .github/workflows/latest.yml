name: Latest Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'IMPL.md'
      - 'MODULES.md'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: latest-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x86_64 ---
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_targets: ''

          # --- Linux ARM64 (native runner) ---
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: ''

          # --- macOS (both arches on macos-latest) ---
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

          # --- Windows x86_64 ---
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  publish:
    name: Update latest release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true

          # Flatten per-target artifact folders, uniquifying the macOS
          # .app bundle / tarball which both macOS arches produce with
          # identical names.
          mkdir -p assets
          for dir in bundles/bundle-*; do
            target="${dir#bundles/bundle-}"
            for entry in "$dir"/*; do
              base="$(basename "$entry")"
              case "$base" in
                *.app.tar.gz) cp "$entry" "assets/${base%.app.tar.gz}-${target}.app.tar.gz" ;;
                *.app)        cp -R "$entry" "assets/${base%.app}-${target}.app" ;;
                *)            cp "$entry" "assets/$base" ;;
              esac
            done
          done

          NOTES="Automatic build from main branch.

          - Commit: $GITHUB_SHA (run #${{ github.run_number }})
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Platforms: Linux x86_64 · Linux ARM64 · macOS (arm64 + x86_64) · Windows x86_64"
          gh release create latest --target "$GITHUB_SHA" \
            --title "Latest build · $(date -u +%Y-%m-%d)" \
            --notes "$NOTES" \
            assets/*

      - name: Show release URL
        run: |
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/latest"
